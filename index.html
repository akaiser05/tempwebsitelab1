<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Senior Design temperature monitoring dashboard">
    <title>Senior Design | Temperature Monitor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="dashboard-shell">
        <header class="dashboard-header">
            <div>
                <p class="eyebrow">Senior Design</p>
                <h1>Temperature monitor</h1>
            </div>
            <div class="controls" aria-label="Dashboard controls">
                <button id="on-off-toggle" class="control-button" type="button" aria-pressed="true"> 
                    On
                </button>
                <button id="sensor-toggle" class="control-button" type="button" aria-pressed="false">
                    Sensor 2
                </button>
                <button id="unit-toggle" class="control-button control-button-unit" type="button" aria-pressed="false">
                    °C
                </button>
            </div>
        </header>

        <section class="current-reading" aria-live="polite" aria-label="Selected sensor temperature">
            <div>
                <span class="reading-label">Selected sensor</span>
                <strong id="selected-sensor">Sensor 1</strong>
            </div>
            <strong id="current-temperature" class="current-temperature">-- °C</strong>
        </section>

        <section class="notification-panel" aria-labelledby="notification-heading">
            <div class="notification-heading">
                <span class="reading-label">Temperature alert</span>
                <h2 id="notification-heading">Alert settings</h2>
                <label class="alert-switch" for="notifications-enabled">
                    <input id="notifications-enabled" type="checkbox">
                    <span>Enable notifications</span>
                </label>
            </div>
            <form id="notification-form" class="notification-form">
                <div class="notification-field notification-field-wide">
                    <label for="notification-contact">Email address</label>
                    <input id="notification-contact" name="contact" type="email" autocomplete="email" placeholder="name@example.com" required>
                </div>
                <div class="notification-field">
                    <label for="maximum-temperature">Maximum temperature (C)</label>
                    <input id="maximum-temperature" type="number" value="40" min="-100" max="200" step="0.1" required>
                </div>
                <div class="notification-field">
                    <label for="minimum-temperature">Minimum temperature (C)</label>
                    <input id="minimum-temperature" type="number" value="15" min="-100" max="200" step="0.1" required>
                </div>
                <div class="notification-field notification-field-wide">
                    <label for="high-message">High-temperature message</label>
                    <input id="high-message" type="text" value="Temperature is too high." required>
                </div>
                <div class="notification-field notification-field-wide">
                    <label for="low-message">Low-temperature message</label>
                    <input id="low-message" type="text" value="Temperature is too low." required>
                </div>
                <div class="notification-actions">
                    <button class="control-button notification-button" type="submit">Save alert settings</button>
                    <p id="notification-status" class="notification-status" role="status" aria-live="polite"></p>
                </div>
            </form>
        </section>

        <section id="sensor-panel-1" class="chart-panel" aria-label="Sensor 1 temperature graph">
            <div class="panel-heading">
                <h2>Sensor 1</h2>
            </div>
            <div class="chart-wrap">
                <svg id="temperature-chart-1" class="temperature-chart" viewBox="0 0 1000 400" role="img" aria-label="Live sensor 1 temperature over time line chart">
                    <g id="grid-lines-1"></g>
                    <g id="axis-labels-1"></g>
                    <g id="time-axis-labels-1"></g>
                    <text class="axis-label" x="470" y="398" text-anchor="middle">seconds ago from the current time</text>
                    <text id="temperature-axis-label-1" class="axis-label" x="960" y="180" text-anchor="middle" transform="rotate(90 960 180)">Temperature (°C)</text>
                    <polyline id="temperature-line-1" points="" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></polyline>
                    <circle id="latest-point-1" r="6" fill="currentColor"></circle>
                </svg>
            </div>
        </section>

        <section id="sensor-panel-2" class="chart-panel" aria-label="Sensor 2 temperature graph" hidden>
            <div class="panel-heading">
                <h2>Sensor 2</h2>
            </div>
            <div class="chart-wrap">
                <svg id="temperature-chart-2" class="temperature-chart" viewBox="0 0 1000 400" role="img" aria-label="Live sensor 2 temperature over time line chart">
                    <g id="grid-lines-2"></g>
                    <g id="axis-labels-2"></g>
                    <g id="time-axis-labels-2"></g>
                    <text class="axis-label" x="470" y="398" text-anchor="middle">seconds ago from the current time</text>
                    <text id="temperature-axis-label-2" class="axis-label" x="960" y="180" text-anchor="middle" transform="rotate(90 960 180)">Temperature (°C)</text>
                    <polyline id="temperature-line-2" points="" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></polyline>
                    <circle id="latest-point-2" r="6" fill="currentColor"></circle>
                </svg>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="script.js?v=3"></script>
</body>
</html>
